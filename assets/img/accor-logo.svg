document.addEventListener('DOMContentLoaded', () => {
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  if (navToggle && navLinks) {
    navToggle.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('is-open');
      navToggle.setAttribute('aria-expanded', String(isOpen));
    });
  }

  const revealNodes = document.querySelectorAll('.reveal, .reveal-stagger');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
      }
    });
  }, { threshold: 0.12 });

  revealNodes.forEach(node => observer.observe(node));

  const trendButtons = document.querySelectorAll('[role="tab"]');
  const trendPanels = document.querySelectorAll('.trend-panel');

  trendButtons.forEach(button => {
    button.addEventListener('click', () => {
      const target = button.dataset.target;
      trendButtons.forEach(btn => {
        const active = btn === button;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-selected', String(active));
        btn.tabIndex = active ? 0 : -1;
      });

      trendPanels.forEach(panel => {
        panel.classList.toggle('is-active', panel.id === target);
      });
    });
  });

  const startupButtons = document.querySelectorAll('[data-filter]');
  const startupCards = document.querySelectorAll('.startup-card');
  startupButtons.forEach(button => {
    button.addEventListener('click', () => {
      const selected = button.dataset.filter;
      startupButtons.forEach(btn => {
        const active = btn === button;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', String(active));
      });

      startupCards.forEach(card => {
        const visible = selected === 'all' || card.dataset.cat === selected;
        card.style.display = visible ? 'block' : 'none';
      });
    });
  });

  const modal = document.getElementById('startupModal');
  const modalBody = document.getElementById('startupModalBody');
  const closeBtn = document.getElementById('startupModalClose');

  startupCards.forEach(card => {
    card.addEventListener('click', () => {
      const name = card.dataset.name || 'Startup';
      const cat = card.dataset.catlabel || 'Innovation';
      const desc = card.dataset.desc || 'Aperçu de la startup.';
      modalBody.innerHTML = `
        <span class="eyebrow">${cat}</span>
        <h3>${name}</h3>
        <p>${desc}</p>
        <p>Ce module est un modèle de présentation pour un atelier de cartographie stratégique.</p>
      `;
      modal.showModal();
    });
  });

  closeBtn?.addEventListener('click', () => modal.close());

  const lazyBackgrounds = document.querySelectorAll('.lazy-bg');
  lazyBackgrounds.forEach(el => {
    const bg = el.dataset.bg;
    if (bg) el.style.backgroundImage = `url('${bg}')`;
  });

  const legendItems = document.querySelectorAll('.opmap-legend li');
  const maps = document.querySelectorAll('.opmap-point');
  function updateMatrixSelection(targetId) {
    const detail = document.getElementById('opmapDetail');
    if (!detail) return;

    const labels = {
      t1: 'Le Voyage Vertical',
      t2: 'La Réservation Sociale',
      t3: 'L\'Ambiance avant le Confort',
      t4: 'Habiter la Longévité',
      t5: 'Le Sommeil Signature',
      t6: 'L\'Hôtel IA-Natif',
      t7: 'L\'Identité Biométrique Urbaine',
      t8: 'Le Day-Use Monétisé',
      t9: 'La Fidélité-as-a-Service'
    };

    detail.innerHTML = `
      <span class="k">Tendance sélectionnée</span>
      <h4>${labels[targetId] || 'Tendance'}</h4>
      <p>Signal stratégique à analyser pour déterminer le bon niveau d’investissement et de faisabilité auprès du groupe.</p>
    `;
  }

  [...legendItems, ...maps].forEach(item => {
    item.addEventListener('click', () => updateMatrixSelection(item.dataset.t));
  });
});
